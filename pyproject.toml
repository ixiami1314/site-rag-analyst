[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "site-rag-analyst"
version = "0.1.0"
description = "Crawl a website, ground an LLM in it, and generate a structured, citation-backed analysis report."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "weijun" }]
requires-python = ">=3.11"
keywords = ["rag", "crawler", "llm", "anythingllm", "retrieval", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "lxml>=5.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlite-vec>=0.1.6",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/ixiami1314/site-rag-analyst"
Issues = "https://github.com/ixiami1314/site-rag-analyst/issues"

[project.scripts]
site-rag = "site_rag_analyst.cli:main"
site-rag-eval = "site_rag_analyst.eval.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/site_rag_analyst"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ruff.lint.per-file-ignores]
# Jinja template lines map 1:1 to output Markdown lines (table rows), so
# wrapping them would corrupt the rendered report.
"src/site_rag_analyst/reporting/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
